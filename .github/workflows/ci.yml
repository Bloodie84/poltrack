name: CI

on:
  push:
    branches: [claude/audio-sharing-platform-pa536y, main]
    paths: ['sonora/**', '.github/workflows/**']
  pull_request:
    paths: ['sonora/**', '.github/workflows/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: sonora

jobs:
  verify:
    name: Types, lint, security, browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      FAKE_SUPABASE_STORAGE: /tmp/sonora-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sonora/package-lock.json

      - name: Install the psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Security assertions against a real PostgreSQL
        run: npm run test:sql

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests, end to end
        run: npm run test:e2e

      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sonora/test-results
          retention-days: 7
